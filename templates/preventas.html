<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 15px 15px 0 0 !important; }
        .nav-glass { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark nav-glass mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-robot"></i> Bot 24/7</a>
            <div>
                <a href="/" class="btn btn-outline-light btn-sm me-2"><i class="bi bi-house"></i> Inicio</a>
                <button class="btn btn-success btn-sm" onclick="verificarPreventas()">
                    <i class="bi bi-search"></i> Verificar
                </button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card mb-4">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-plus-circle"></i> Nueva Preventa</h5></div>
            <div class="card-body">
                <form id="formPreventa">
                    <div class="row">
                        <div class="col-md-8 mb-2">
                            <label>URL (tcgfactory.com)</label>
                            <input type="url" class="form-control" id="urlPreventa" placeholder="https://www.tcgfactory.com/es/producto..." required>
                        </div>
                        <div class="col-md-2 mb-2">
                            <label>Cantidad</label>
                            <input type="number" class="form-control" id="cantidadPreventa" value="1" min="1">
                        </div>
                        <div class="col-md-2 mb-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i></button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-list"></i> Mis Preventas</h5></div>
            <div class="card-body">
                <div id="listaPreventas">
                    {% if preventas %}
                        {% for p in preventas %}
                        <div class="d-flex justify-content-between align-items-center border-bottom py-2">
                            <div>
                                <span class="badge bg-{{ 'success' if p.estado == 'completado' else 'warning' if p.estado == 'en_carrito' else 'secondary' }}">
                                    {{ p.estado }}
                                </span>
                                <small class="ms-2">{{ p.url[:60] }}...</small>
                                <span class="badge bg-info ms-2">x{{ p.cantidad }}</span>
                            </div>
                            <button class="btn btn-danger btn-sm" onclick="eliminarPreventa({{ loop.index0 }})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                        {% endfor %}
                    {% else %}
                    <p class="text-muted text-center mb-0">No hay preventas</p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>

    <script>
        $('#formPreventa').submit(function(e) {
            e.preventDefault();
            $.ajax({
                url: '/api/preventas/agregar',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({url: $('#urlPreventa').val(), cantidad: $('#cantidadPreventa').val()}),
                success: function(r) { if(r.success) location.reload(); else alert(r.error); }
            });
        });

        function eliminarPreventa(index) {
            if(!confirm('¿Eliminar?')) return;
            $.ajax({
                url: '/api/preventas/eliminar/' + index,
                method: 'DELETE',
                success: function(r) { if(r.success) location.reload(); }
            });
        }

        function verificarPreventas() {
            const btn = event.target;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';
            
            $.ajax({
                url: '/api/preventas/verificar',
                method: 'POST',
                contentType: 'application/json',
                success: function(r) {
                    let msg = 'Resultados:\n';
                    r.resultados.forEach(p => {
                        msg += `${p.url}: ${p.disponible ? '✅ Disponible' : '❌ No'}\n`;
                    });
                    alert(msg);
                    location.reload();
                },
                complete: function() {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="bi bi-search"></i> Verificar';
                }
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

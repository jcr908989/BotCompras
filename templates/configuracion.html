<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .card-header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 15px 15px 0 0 !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-robot"></i> Bot de Compras</a>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <div class="card-header"><h5 class="mb-0"><i class="bi bi-gear"></i> Configuración</h5></div>
            <div class="card-body">
                <form method="POST">
                    <h6 class="text-primary mb-3"><i class="bi bi-person"></i> Datos de Envío</h6>
                    <div class="row mb-3">
                        <div class="col-md-6 mb-2">
                            <label>Nombre</label>
                            <input type="text" class="form-control" name="nombre" value="{{ config.datos_pago.nombre }}">
                        </div>
                        <div class="col-md-6 mb-2">
                            <label>Apellido</label>
                            <input type="text" class="form-control" name="apellido" value="{{ config.datos_pago.apellido }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label>Dirección</label>
                        <input type="text" class="form-control" name="direccion" value="{{ config.datos_pago.direccion }}">
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4 mb-2">
                            <label>Ciudad</label>
                            <input type="text" class="form-control" name="ciudad" value="{{ config.datos_pago.ciudad }}">
                        </div>
                        <div class="col-md-4 mb-2">
                            <label>Código Postal</label>
                            <input type="text" class="form-control" name="codigo_postal" value="{{ config.datos_pago.codigo_postal }}">
                        </div>
                        <div class="col-md-4 mb-2">
                            <label>Teléfono</label>
                            <input type="text" class="form-control" name="telefono" value="{{ config.datos_pago.telefono }}">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" name="email" value="{{ config.datos_pago.email }}">
                    </div>

                    <hr>
                    <h6 class="text-primary mb-3"><i class="bi bi-telegram"></i> Notificaciones Telegram</h6>
                    <div class="alert alert-info">
                        <strong>¿Cómo obtener Token y Chat ID?</strong><br>
                        1. En Telegram busca <a href="https://t.me/botfather" target="_blank">@BotFather</a> y crea un bot<br>
                        2. Te dará un token. Cópialo<br>
                        3. Busca <a href="https://t.me/userinfobot" target="_blank">@userinfobot</a> y te dará tu ID
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-6 mb-2">
                            <label>Bot Token</label>
                            <input type="text" class="form-control" name="telegram_token" value="{{ telegram_config.bot_token }}" placeholder="123456:ABC-DEF1234ghIkl">
                        </div>
                        <div class="col-md-6 mb-2">
                            <label>Chat ID</label>
                            <input type="text" class="form-control" name="telegram_chat_id" value="{{ telegram_config.chat_id }}" placeholder="123456789">
                        </div>
                    </div>

                    <hr>
                    <h6 class="text-primary mb-3"><i class="bi bi-credit-card"></i> Tarjeta (Opcional)</h6>
                    <div class="row mb-3">
                        <div class="col-md-6 mb-2">
                            <label>Número</label>
                            <input type="text" class="form-control" name="tarjeta_numero" value="{{ config.tarjeta.numero }}">
                        </div>
                        <div class="col-md-2 mb-2">
                            <label>Mes</label>
                            <input type="text" class="form-control" name="tarjeta_mes" value="{{ config.tarjeta.mes_expiracion }}">
                        </div>
                        <div class="col-md-2 mb-2">
                            <label>Año</label>
                            <input type="text" class="form-control" name="tarjeta_anio" value="{{ config.tarjeta.anio_expiracion }}">
                        </div>
                        <div class="col-md-2 mb-2">
                            <label>CVV</label>
                            <input type="text" class="form-control" name="tarjeta_cvv" value="{{ config.tarjeta.cvv }}">
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary btn-lg"><i class="bi bi-save"></i> Guardar</button>
                        <a href="/" class="btn btn-secondary btn-lg ms-2">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
